<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guitar Retreat 2026 — Homesick Mac Songbook</title>
<style>
  :root{
    --bg:#0b0b0d;
    --bg-card:#17171b;
    --fg:#f2f2f0;
    --fg-dim:#a3a3ab;
    --accent:#e0b13c;
    --accent-dim:#8a6c22;
    --line:#2c2c33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}

  #app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

  /* ---------- Sidebar ---------- */
  #sidebar{width:300px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--line);
    overflow-y:auto;transition:width .2s ease,opacity .2s ease;opacity:1;}
  #sidebar.collapsed{width:0;opacity:0;overflow:hidden;border-right:none;}
  #sidebar-header{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--bg-card);}
  #sidebar-header h1{margin:0;font-size:16px;color:var(--accent);font-weight:700;letter-spacing:.3px;}
  #sidebar-header .sub{margin-top:3px;font-size:12px;color:var(--fg-dim);}
  .side-song{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;gap:10px;align-items:center;}
  .side-song:hover{background:var(--bg);}
  .side-song.active{background:var(--accent);}
  .side-song.active .side-name{color:#1a1400;font-weight:700;}
  .side-song.active .side-num{color:#1a1400;}
  /* Lifted-and-carried look while dragging - same treatment as the setlist
     app's own drag-reorder (.setlist-card.dragging / .setlist-item.dragging
     in app-template.html), so both apps feel consistent. */
  .side-song.dragging{opacity:1;box-shadow:0 18px 34px rgba(0,0,0,.6);position:relative;
    z-index:50;cursor:grabbing;will-change:transform;background:var(--bg-card);border-radius:8px;}
  #song-list.drag-active .side-song:not(.dragging){transition:transform 150ms ease;}
  /* Drag handle: separate from the row's own click-to-open behaviour, so
     grabbing the handle reorders while tapping the rest of the row still
     opens the song, same "handle is its own thing" pattern as the drag
     handles in the setlist app's setlist/song reordering. touch-action:none
     stops the browser trying to scroll the list while a finger is dragging. */
  .side-drag-handle{cursor:grab;color:var(--fg-dim);font-size:14px;line-height:1;flex-shrink:0;
    touch-action:none;user-select:none;padding:2px;}
  .side-drag-handle:active{cursor:grabbing;}
  .side-num{color:var(--accent-dim);font-size:12.5px;font-weight:700;flex-shrink:0;min-width:16px;}
  .side-name{font-size:14px;color:var(--fg);line-height:1.35;}
  .side-marker{padding:10px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--fg-dim);border-bottom:1px solid var(--line);background:var(--bg);}
  #reset-order-btn{margin-top:8px;background:none;border:none;color:var(--fg-dim);font-size:11.5px;
    padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  #reset-order-btn:hover{color:var(--fg);}

  /* ---------- Main pane ---------- */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #main-topbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 14px;
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  #sidebar-toggle{flex-shrink:0;background:var(--bg-card);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;width:36px;height:36px;font-size:16px;}
  .nav-btn{flex-shrink:0;background:var(--bg-card);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;width:36px;height:36px;font-size:16px;}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  #nav-counter{flex-shrink:0;font-size:12.5px;color:var(--fg-dim);min-width:56px;text-align:center;}
  #main-song-info{flex:1;min-width:120px;}
  #main-song-title{font-size:15.5px;font-weight:700;color:var(--fg);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  #main-song-artist{font-size:12px;color:var(--fg-dim);}
  #main-song-artist.hidden{display:none;}
  /* Auto-scroll (start/stop) and Loop (on/off) are deliberately two separate,
     equally-sized pill buttons rather than one combined control - Mac found
     a single "Auto-scroll (loop)" toggle unpredictable once songs of
     different lengths and different per-song speeds were involved, so he
     wanted to be able to turn looping off independently of starting or
     stopping the scroll itself. */
  #scroll-toggle,#loop-toggle{flex-shrink:0;background:var(--bg-card);color:var(--fg);border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;}
  #scroll-toggle.active,#loop-toggle.active{background:var(--accent);color:#1a1400;border-color:var(--accent);}
  .speed-ctl{display:flex;align-items:center;gap:6px;flex-shrink:0;color:var(--fg-dim);font-size:12.5px;}
  .speed-ctl button{width:28px;height:28px;border-radius:8px;background:var(--bg-card);border:1px solid var(--line);
    color:var(--fg);font-size:16px;line-height:1;padding:0;}
  .speed-ctl .speed-label{min-width:54px;text-align:center;}

  /* Full-width reading pane - no capped/centered column. Mac wanted the
     lyrics to naturally use all the space #main has to give (big screen,
     teaching room), with the scrollbar sitting flush at the pane's true
     right edge instead of floating in from a centered max-width column
     leaving empty space on both sides. Applies the same whether the sidebar
     is shown or collapsed - #main is just whatever width is left over
     either way. */
  #song-content{flex:1;overflow-y:auto;padding:26px 32px 80px;width:100%;}
  .song-img{width:100%;height:auto;display:block;border-radius:10px;}
  .song-lyrics{white-space:pre-wrap;font-size:clamp(19px,2.2vw,28px);line-height:1.55;}
  .song-lyrics.chords{white-space:pre;overflow-x:auto;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;
    font-size:clamp(15px,1.8vw,22px);}
  .song-empty{color:var(--fg-dim);font-style:italic;font-size:17px;}

  @media (max-width: 700px){
    #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:20;width:82vw;max-width:320px;
      box-shadow:2px 0 20px rgba(0,0,0,.5);}
    #sidebar.collapsed{width:0;box-shadow:none;}
    #main-song-artist{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Guitar Retreat 2026</h1>
      <div class="sub">Songbook · 13 songs</div>
      <button id="reset-order-btn" title="Restore the original song order">↺ Reset order</button>
    </div>
    <div id="song-list"></div>
  </div>
  <div id="main">
    <div id="main-topbar">
      <button id="sidebar-toggle" title="Show/hide song list">☰</button>
      <button class="nav-btn" id="nav-prev" title="Previous song">‹</button>
      <button class="nav-btn" id="nav-next" title="Next song">›</button>
      <span id="nav-counter">—</span>
      <div id="main-song-info">
        <div id="main-song-title">—</div>
        <div id="main-song-artist" class="hidden"></div>
      </div>
      <button id="scroll-toggle">▶ Auto-scroll</button>
      <button id="loop-toggle" title="When on, reaching the end of a song pauses briefly then loops back to the top. When off, auto-scroll just stops at the end.">🔁 Loop: On</button>
      <div class="speed-ctl">
        <button id="speed-minus" title="Slower">−</button>
        <span class="speed-label" id="speed-label">Speed 3</span>
        <button id="speed-plus" title="Faster">+</button>
      </div>
    </div>
    <div id="song-content"></div>
  </div>
</div>

ing you got something else to do\n\nI saw her from the corner when she turned and doubled back\nAnd started walkin' toward a coffee colored Cadillac\nI was pushin' through the crowd tryna get to where she's at\nAnd I was campaign shouting like a southern diplomat\nNadine, honey is that you?\nOh, Nadine\nHoney, where are you?\nSeems like every time I catch up with you\nYou are up to something new\n\nDowntown searching for 'er, looking all around\nSaw her getting in a yellow cab heading up town\nI caught a loaded taxi, paid up everybody's tab\nFlipped a twenty dollar bill, told him \"Catch that yellow cab\"\nNadine, honey is that you?\nOh, Nadine\nHoney, is that you?\nSeems like every time I catch up with you\nYou are up to something new\n\nShe move around like a wave of summer breeze,\nGo, driver, go, go on, catch 'er for me please\nMoving through the traffic like a mounted cavalier\nLeaning out the taxi window, trying to make her hear\nNadine, honey is that you?\nOh, Nadine\nHoney, is that you?\nSeems like every time I see you", "lyricsImage": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqsAAATZCAYAAADzIV0BAAAAAXNSR0IArs4c6QAAAFZlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA5KGAAcAAAASAAAARKACAAQAAAABAAACq6ADAAQAAAABAAAE2QAAAABBU0NJSQAAAFNjcmVlbnNob3S50pgtAABAAElEQVR4AexdB5QURRMuMkgSBJGMDyQJB4gIiIAkBckgOUiOcuSMJAGRaCAnEfxBkChJjnRkUHKWnJUkKAqC4v791dLD7N7s7uxykat6b3d6uquru7/umampru6J41BEQoKAICAICAKCgCAgCAgCgkA0RCBuNKyTVEkQEAQEAUFAEBAEBAFBQBBgBERZlYEgCAgCgoAgIAgIAoKAIBBtERBlNdp2jVRMEBAEBAFBQBAQBAQBQUCUVRkDgoAgIAgIAoKAICAICALRFgFRVqNt10jFBAFBQBAQBAQBQUAQEAREWZUxIAgIAoKAICAICAKCgCAQbREQZTXado1UTBAQBAQBQUAQEAQEAUFAlFUZA4KAICAICAKCgCAgCAgC0RYBUVajbddIxQQBQUAQEAQEAUFAEBAERFl9PAZuXL8WZjRYxYVhkghBQBAQBAQBQUAQEAQEgQhDIEYrq+GlTB4/eoi2hq7jn0baKk6nyTF2IPDPP//QN998Q8ePHw/XBv/222+0fPkyun79erjKjWphd+7c4Xb9+uuvXqty+PBh+u67hbRhwwavfJGVaLfekVUfKUcQEAQEAUHAFYEYrazevHHNRcF0bZr9M8gBpUmbzshkFWckRmDgs88+o/z584XLg/zy5cssa/HixRFYY6fo//77j7Zs2ULnz5+P8LIiq4BTp07Rp5+OpJkzZ3CR4dXGy5cv0YABA+js2TOR1   function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  // ---------- Sidebar show/hide - independent of song navigation, so Mac can
  // hide the upcoming-songs list from students while still moving through
  // the set via the always-visible prev/next buttons. ----------
  var SIDEBAR_KEY = 'hm_songbook_sidebar_v1';
  function setSidebar(shown){
    sidebarEl.classList.toggle('collapsed', !shown);
    localStorage.setItem(SIDEBAR_KEY, shown ? 'shown' : 'hidden');
  }
  (function initSidebar(){
    var saved = localStorage.getItem(SIDEBAR_KEY);
    setSidebar(saved !== 'hidden'); // shown by default
  })();
  sidebarToggleBtn.addEventListener('click', function(){
    setSidebar(sidebarEl.classList.contains('collapsed'));
  });

  // ---------- Sidebar song order - Mac asked to be able to drag songs into
  // whatever order he wants directly in the browser, rather than only via
  // the build-time SONG_ORDER list. Stored separately from the song data
  // itself (a plain array of song ids) so it survives a rebuild: rebuilding
  // this page (new lyrics, new songs) doesn't wipe out a reorder Mac already
  // did, and any song not yet in a saved order (e.g. one just added to the
  // library) falls back to its normal build-time position instead of
  // vanishing. Per-browser only, same as every other localStorage-backed
  // preference in this project (auto-scroll speed, sidebar shown/hidden). ----------
  var ORDER_KEY = 'hm_songbook_app_order_v1';
  var DEFAULT_SONGS = SONGS.slice(); // build-time order, kept so "Reset order" can restore it

  function loadSavedOrder(){
    try{
      var raw = localStorage.getItem(ORDER_KEY);
      if(!raw) return null;
      var ids = JSON.parse(raw);
      return Array.isArray(ids) ? ids : null;
    }catch(e){ return null; }
  }

  function applySavedOrder(){
    var savedIds = loadSavedOrder();
    if(!savedIds || !savedIds.length) return;
    var byId = {};
    SONGS.forEach(function(s){ byId[s.id] = s; });
    var seen = {};
    var reordered = [];
    savedIds.forEach(function(id){
      if(byId.hasOwnProperty(id) && !seen[id]){
        reordered.push(byId[id]);
        seen[id] = true;
      }
    });
    SONGS.forEach(function(s){
      if(!seen[s.id]){ reordered.push(s); seen[s.id] = true; }
    });
    SONGS = reordered;
  }

  function saveCurrentOrder(){
    localStorage.setItem(ORDER_KEY, JSON.stringify(SONGS.map(function(s){ return s.id; })));
  }

  function resetOrder(){
    setAutoScroll(false);
    var activeId = SONGS[currentIdx] ? SONGS[currentIdx].id : null;
    SONGS = DEFAULT_SONGS.slice();
    localStorage.removeItem(ORDER_KEY);
    currentIdx = activeId != null ? Math.max(0, SONGS.findIndex(function(s){ return s.id === activeId; })) : 0;
    renderSidebar();
    renderSong();
  }
  resetOrderBtn.addEventListener('click', resetOrder);

  // ---------- Sidebar drag-to-reorder ----------
  // Same "pick up and carry" feel as the interactive setlist app's own
  // drag-reorder (enableDragReorder in app-template.html), so both apps feel
  // consistent: the dragged row tracks the pointer continuously via a live
  // transform (lift + slight scale + tilt) while the other rows slide out of
  // the way to open a gap, rather than physically snapping into a
  // neighbour's slot the instant the pointer crosses its midpoint. Geometry
  // is frozen once at pickup (never re-measured mid-drag, which would pick
  // up the siblings' own temporary shift transforms and corrupt the
  // numbers); the real SONGS array is only reordered once, on drop - which
  // is also what triggers the one full renderSidebar() that clears every
  // temporary transform in one go. A small "⠿" handle on each row is the
  // only thing that starts a drag, so tapping the rest of the row still just
  // opens that song. Listeners are attached once on the stable #song-list
  // container (event delegation) rather than per-row, so they keep working
  // across every re-render without needing to be reattached.
  //
  // #sidebar itself is the scrollable ancestor, so dragging near its top or
  // bottom edge auto-scrolls it - matters once the library grows past what
  // fits on screen, same as long setlists in the setlist app.
  (function initSidebarDragReorder(){
    var DRAG_EDGE_ZONE = 60; // px from the sidebar's edge that triggers auto-scroll
    var DRAG_MAX_SCROLL_SPEED = 14; // px per animation frame at the very edge

    var dragEl = null;
    var pointerId = null;
    var startY = 0;
    var dragElHeight = 0;
    var dragStartPos = -1; // dragEl's index within itemsSnapshot at pickup time
    var lastNewIndex = -1; // most recently computed target slot among the non-dragged rows
    var itemsSnapshot = []; // frozen geometry captured once at pickup
    var scrollStartTop = 0;
    var lastPointerY = 0;
    var autoScrollSpeed = 0;
    var autoScrollRAF = null;

    function sideSongRows(){
      return Array.prototype.slice.call(songListEl.querySelectorAll('.side-song'));
    }

    function pointerDown(e){
      var handle = e.target.closest ? e.target.closest('.side-drag-handle') : null;
      if(!handle || !songListEl.contains(handle)) return;
      var row = handle.closest('.side-song');
      if(!row || row.parentNode !== songListEl) return;
      dragEl = row;
      pointerId = e.pointerId;
      try{ dragEl.setPointerCapture(pointerId); }catch(err){}

      var allRows = sideSongRows();
      itemsSnapshot = allRows.map(function(el){
        var rect = el.getBoundingClientRect();
        return { el: el, centerY: rect.top + rect.height / 2 };
      });
      dragStartPos = allRows.indexOf(dragEl);
      lastNewIndex = dragStartPos;
      dragElHeight = dragEl.getBoundingClientRect().height;
      startY = e.clientY;
      lastPointerY = e.clientY;
      scrollStartTop = sidebarEl.scrollTop;

      dragEl.classList.add('dragging');
      songListEl.classList.add('drag-active');
      e.preventDefault();
    }

    function applyDragVisuals(){
      var scrollDelta = sidebarEl.scrollTop - scrollStartTop;
      var deltaY = (lastPointerY - startY) + scrollDelta;
      dragEl.style.transform = 'translateY(' + deltaY + 'px) scale(1.03) rotate(1deg)';

      var pointerYInOriginalSpace = lastPointerY - scrollDelta;
      var nonDrag = [];
      itemsSnapshot.forEach(function(snap, i){ if(i !== dragStartPos) nonDrag.push(snap); });

      var newIndex = 0;
      nonDrag.forEach(function(snap){ if(pointerYInOriginalSpace >= snap.centerY) newIndex++; });
      lastNewIndex = newIndex;

      var lo = Math.min(newIndex, dragStartPos);
      var hi = Math.max(newIndex, dragStartPos);
      var movingUp = newIndex < dragStartPos;
      nonDrag.forEach(function(snap, k){
        snap.el.style.transform = (k >= lo && k < hi) ? ('translateY(' + (movingUp ? dragElHeight : -dragElHeight) + 'px)') : '';
      });
    }

    function autoScrollTick(){
      if(!dragEl || !autoScrollSpeed){ autoScrollRAF = null; return; }
      sidebarEl.scrollTop += autoScrollSpeed;
      applyDragVisuals();
      autoScrollRAF = window.requestAnimationFrame(autoScrollTick);
    }

    function updateAutoScrollSpeed(){
      var rect = sidebarEl.getBoundingClientRect();
      var distFromTop = lastPointerY - rect.top;
      var distFromBottom = rect.bottom - lastPointerY;
      var speed = 0;
      if(distFromTop >= 0 && distFromTop < DRAG_EDGE_ZONE){
        speed = -DRAG_MAX_SCROLL_SPEED * (1 - distFromTop / DRAG_EDGE_ZONE);
      } else if(distFromBottom >= 0 && distFromBottom < DRAG_EDGE_ZONE){
        speed = DRAG_MAX_SCROLL_SPEED * (1 - distFromBottom / DRAG_EDGE_ZONE);
      }
      autoScrollSpeed = speed;
      if(autoScrollSpeed && autoScrollRAF === null){
        autoScrollRAF = window.requestAnimationFrame(autoScrollTick);
      }
    }

    function stopAutoScroll(){
      autoScrollSpeed = 0;
      if(autoScrollRAF !== null){ window.cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
    }

    function pointerMove(e){
      if(!dragEl || e.pointerId !== pointerId) return;
      e.preventDefault();
      lastPointerY = e.clientY;
      applyDragVisuals();
      updateAutoScrollSpeed();
    }

    function pointerEnd(e){
      if(!dragEl || (pointerId !== null && e.pointerId !== pointerId)) return;
      stopAutoScroll();
      dragEl.classList.remove('dragging');
      songListEl.classList.remove('drag-active');

      var draggedId = dragEl.dataset.songId;
      var nonDragIds = [];
      itemsSnapshot.forEach(function(snap){ if(snap.el !== dragEl) nonDragIds.push(snap.el.dataset.songId); });
      var insertAt = Math.max(0, Math.min(lastNewIndex, nonDragIds.length));
      nonDragIds.splice(insertAt, 0, draggedId);

      var byId = {};
      SONGS.forEach(function(s){ byId[String(s.id)] = s; });
      var newOrder = nonDragIds.map(function(id){ return byId[id]; }).filter(Boolean);
      // Sanity check: only trust the reordered array if it accounts for
      // every song (a stray DOM state should never lose or duplicate a
      // song) - otherwise leave SONGS untouched rather than risk dropping one.
      if(newOrder.length === SONGS.length){
        var activeId = SONGS[currentIdx] ? SONGS[currentIdx].id : null;
        SONGS = newOrder;
        saveCurrentOrder();
        if(activeId != null){
          var newIdx = SONGS.findIndex(function(s){ return s.id === activeId; });
          if(newIdx !== -1) currentIdx = newIdx;
        }
      }

      dragEl.style.transform = '';
      dragEl = null;
      pointerId = null;
      renderSidebar(); // full re-render replaces every node fresh, so no leftover transforms to clean up
    }

    songListEl.addEventListener('pointerdown', pointerDown);
    songListEl.addEventListener('pointermove', pointerMove);
    songListEl.addEventListener('pointerup', pointerEnd);
    songListEl.addEventListener('pointercancel', pointerEnd);
  })();

  function renderSidebar(){
    songListEl.innerHTML = '';
    SONGS.forEach(function(song, i){
      if(i === FRONT_SET_COUNT){
        var marker = document.createElement('div');
        marker.className = 'side-marker';
        marker.textContent = 'More songs';
        songListEl.appendChild(marker);
      }
      var row = document.createElement('div');
      row.className = 'side-song' + (i === currentIdx ? ' active' : '');
      row.dataset.songId = song.id;
      row.innerHTML = '<span class="side-drag-handle" title="Drag to reorder">⠿</span>' +
        '<span class="side-num">' + (i + 1) + '</span><span class="side-name">' + escapeHtml(song.name) + '</span>';
      row.addEventListener('click', function(e){
        if(e.target.classList.contains('side-drag-handle')) return;
        selectSong(i);
      });
      songListEl.appendChild(row);
    });
  }

  // ---------- Song content - only the active song is ever rendered into the
  // pane, unlike the linear songbook page where every song sits on one long
  // scrolling page. That also means there's no "bleeding into the next
  // song" problem here - there's no next song's content to bleed into. ----------
  function renderSong(){
    var song = SONGS[currentIdx];
    titleEl.textContent = song.name;
    if(song.artist && song.artist.length){
      artistEl.textContent = song.artist.join(', ');
      artistEl.classList.remove('hidden');
    } else {
      artistEl.classList.add('hidden');
    }
    contentEl.innerHTML = '';
    contentEl.scrollTop = 0;
    if(song.lyricsImage){
      var img = document.createElement('img');
      img.className = 'song-img';
      img.src = song.lyricsImage;
      img.alt = 'Chords and lyrics for ' + song.name;
      contentEl.appendChild(img);
    } else if(song.lyrics){
      var pre = document.createElement('div');
      pre.className = 'song-lyrics' + (song.chords ? ' chords' : '');
      pre.textContent = song.lyrics;
      contentEl.appendChild(pre);
    } else {
      var empty = document.createElement('div');
      empty.className = 'song-empty';
      empty.textContent = 'No lyrics on file for this one - check Notion.';
      contentEl.appendChild(empty);
    }
    counterEl.textContent = (currentIdx + 1) + ' of ' + SONGS.length;
    prevBtn.disabled = currentIdx === 0;
    nextBtn.disabled = currentIdx === SONGS.length - 1;
  }

  function selectSong(i){
    if(i < 0 || i >= SONGS.length) return;
    setAutoScroll(false); // switching songs always stops any running loop, rather than looping the song you just left
    currentIdx = i;
    renderSong();
    applySongSpeed(SONGS[currentIdx].id);
    renderSidebar();
  }

  prevBtn.addEventListener('click', function(){ selectSong(currentIdx - 1); });
  nextBtn.addEventListener('click', function(){ selectSong(currentIdx + 1); });

  // ---------- Auto-scroll - loops instead of stopping. Same 5-step speed
  // scale and the same localStorage key as setlist.html and songbook.html,
  // so a speed set for a song on any of the three pages carries over to the
  // others (same origin). ----------
  var scrollSpeeds = [8, 22, 35, 55, 80]; // px/sec, slow -> fast
  var SONG_SCROLL_KEY = 'hm_song_scroll_speed_v1';
  var songScrollSpeeds = {};
  try{
    var raw = localStorage.getItem(SONG_SCROLL_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object') songScrollSpeeds = parsed;
    }
  }catch(e){}
  function saveSongScrollSpeeds(){
    localStorage.setItem(SONG_SCROLL_KEY, JSON.stringify(songScrollSpeeds));
  }

  var scrollSpeedIdx = 2;
  function updateSpeedLabel(){ speedLabelEl.textContent = 'Speed ' + (scrollSpeedIdx + 1); }
  function applySongSpeed(songId){
    if(songId != null && songScrollSpeeds.hasOwnProperty(songId)){
      scrollSpeedIdx = songScrollSpeeds[songId];
    }
    updateSpeedLabel();
  }
  function saveCurrentSongScrollSpeed(){
    var song = SONGS[currentIdx];
    if(!song) return;
    songScrollSpeeds[song.id] = scrollSpeedIdx;
    saveSongScrollSpeeds();
  }

  var autoOn = false;
  var rafId = null;
  var lastTs = null;
  var scrollPos = 0; // true fractional scroll position tracked outside scrollTop,
                      // which itself only ever holds whole pixels - same fix used
                      // for auto-scroll throughout this project.
  var LOOP_PAUSE_MS = 10000; // headroom at the end of a loop, so the last line
                             // has time to actually be read before it jumps
                             // back to the top - Mac found it was restarting
                             // the instant it hit the bottom, with no beat to
                             // register the song had finished. Raised from
                             // 3500 to 10000 (2026-07-20 follow-up) - the
                             // first value felt like ~5s in practice, not
                             // long enough.
  var pausedUntil = null; // rAF timestamp when the current end-of-song pause ends, or null if not paused

  // ---------- Loop on/off - a separate control from Auto-scroll itself.
  // Mac found the combined "Auto-scroll (loop)" button unpredictable once
  // different songs (different lengths) and different per-song speeds were
  // in play - sometimes he wants a song to loop a few times while teaching
  // it, sometimes he just wants it to scroll through once and stop, and the
  // two shouldn't be tied together. Persisted globally (not per-song) since
  // it's a mode Mac switches between deliberately, not a per-song setting
  // like scroll speed. ----------
  var LOOP_KEY = 'hm_songbook_app_loop_v1';
  var loopOn = localStorage.getItem(LOOP_KEY) !== 'off'; // defaults on
  function updateLoopButton(){
    loopToggleBtn.textContent = loopOn ? '🔁 Loop: On' : '🔁 Loop: Off';
    loopToggleBtn.classList.toggle('active', loopOn);
  }
  function setLoop(on){
    loopOn = on;
    localStorage.setItem(LOOP_KEY, on ? 'on' : 'off');
    updateLoopButton();
  }
  loopToggleBtn.addEventListener('click', function(){ setLoop(!loopOn); });

  function autoScrollStep(ts){
    if(!autoOn) return;
    if(pausedUntil !== null){
      // Sitting on the last line - don't advance scroll position at all
      // until the pause has elapsed. Re-check loopOn at that point too (not
      // just when the pause was armed) in case Mac turned looping off while
      // a pause was already in progress.
      if(ts >= pausedUntil){
        pausedUntil = null;
        if(loopOn){
          scrollPos = 0;
          contentEl.scrollTop = 0;
        } else {
          setAutoScroll(false);
          return;
        }
      }
      lastTs = ts;
      rafId = window.requestAnimationFrame(autoScrollStep);
      return;
    }
    if(lastTs !== null){
      var dt = (ts - lastTs) / 1000;
      var pxPerSec = scrollSpeeds[scrollSpeedIdx];
      scrollPos += pxPerSec * dt;
      contentEl.scrollTop = scrollPos;
      // Reached the bottom of this song's content. With Loop on: hold here
      // for LOOP_PAUSE_MS (last line stays on screen) before jumping back to
      // the top and continuing at the same speed. With Loop off: just stop,
      // same as the plain auto-stop-at-end behaviour in songbook.html.
      if(contentEl.scrollTop + contentEl.clientHeight >= contentEl.scrollHeight - 2){
        if(loopOn){
          pausedUntil = ts + LOOP_PAUSE_MS;
        } else {
          setAutoScroll(false);
          return;
        }
      }
    }
    lastTs = ts;
    rafId = window.requestAnimationFrame(autoScrollStep);
  }

  function setAutoScroll(on){
    autoOn = on;
    if(on){
      lastTs = null;
      pausedUntil = null;
      scrollPos = contentEl.scrollTop;
      if(rafId) window.cancelAnimationFrame(rafId);
      rafId = window.requestAnimationFrame(autoScrollStep);
    } else if(rafId){
      window.cancelAnimationFrame(rafId);
      rafId = null;
    }
    scrollToggleBtn.textContent = autoOn ? '⏸ Auto-scroll' : '▶ Auto-scroll';
    scrollToggleBtn.classList.toggle('active', autoOn);
  }

  scrollToggleBtn.addEventListener('click', function(){ setAutoScroll(!autoOn); });
  speedMinusBtn.addEventListener('click', function(){
    scrollSpeedIdx = Math.max(0, scrollSpeedIdx - 1);
    updateSpeedLabel();
    saveCurrentSongScrollSpeed();
  });
  speedPlusBtn.addEventListener('click', function(){
    scrollSpeedIdx = Math.min(scrollSpeeds.length - 1, scrollSpeedIdx + 1);
    updateSpeedLabel();
    saveCurrentSongScrollSpeed();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      setAutoScroll(!autoOn);
    } else if(e.key === 'ArrowRight'){
      selectSong(currentIdx + 1);
    } else if(e.key === 'ArrowLeft'){
      selectSong(currentIdx - 1);
    }
  });

  // ---------- Init ----------
  applySavedOrder();
  renderSidebar();
  renderSong();
  applySongSpeed(SONGS[0] && SONGS[0].id);
  updateSpeedLabel();
  updateLoopButton();
})();
</script>
</body>
</html>
