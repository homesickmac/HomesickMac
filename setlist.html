<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Homesick Mac — Setlists</title>
<link rel="apple-touch-icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root{
    --bg:#0b0b0d;
    --bg-card:#17171b;
    --bg-card-2:#1f1f24;
    --fg:#f2f2f0;
    --fg-dim:#a3a3ab;
    --accent:#e0b13c;
    --accent-dim:#8a6c22;
    --line:#2c2c33;
    --danger:#c0503f;
    --ok:#5fae6e;
    --none:#55555c;
    --radius:14px;
    --live-font: 30px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  #app{display:flex;flex-direction:column;height:100%;min-height:100vh;}

  /* Top bar / tabs */
  #topbar{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
  #topbar h1{font-size:17px;margin:0;color:var(--accent);font-weight:700;letter-spacing:.3px;flex:1;}
  .tabbar{display:flex;gap:6px;}
  .tab-btn{background:var(--bg-card);color:var(--fg-dim);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;}
  .tab-btn.active{background:var(--accent);color:#1a1400;border-color:var(--accent);}

  main.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 40px;display:none;}
  main.view.active{display:block;}

  /* Library */
  .search-row{display:flex;gap:8px;margin-bottom:10px;position:sticky;top:0;background:var(--bg);padding-bottom:8px;z-index:5;}
  .search-input-wrap{position:relative;flex:1;display:flex;}
  .search-input-wrap input{flex:1;background:var(--bg-card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px 40px 12px 14px;font-size:16px;width:100%;}
  .search-clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:var(--bg-card-2);color:var(--fg-dim);border-radius:50%;font-size:15px;line-height:1;display:none;align-items:center;justify-content:center;}
  .search-input-wrap.has-value .search-clear-btn{display:flex;}
  .filter-chip{background:var(--bg-card);border:1px solid var(--line);color:var(--fg-dim);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;white-space:nowrap;}
  .filter-chip.active{background:var(--ok);color:#082a0d;border-color:var(--ok);}
  .count-line{color:var(--fg-dim);font-size:13px;margin:2px 2px 10px;}

  .song-row{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
  .song-row-head{display:flex;align-items:center;gap:10px;padding:13px 14px;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.has{background:var(--ok);}
  .dot.none{background:var(--none);}
  .song-info{flex:1;min-width:0;}
  .song-name{font-size:16px;font-weight:600;line-height:1.3;}
  .song-meta{font-size:12.5px;color:var(--fg-dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{background:var(--bg-card-2);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--fg-dim);}
  .chevron{color:var(--fg-dim);font-size:13px;padding:4px;}
  .song-row-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);}
  .song-row.open .song-row-body{display:block;padding-top:12px;}
  .lyrics-preview{white-space:pre-wrap;font-size:14.5px;line-height:1.55;color:#dcdcd8;max-height:220px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .no-lyrics-note{color:var(--fg-dim);font-size:13.5px;font-style:italic;margin-bottom:10px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:1px solid var(--line);background:var(--bg-card-2);color:var(--fg);border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:600;}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#1a1400;}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn.ghost{background:transparent;}
  .btn:active{opacity:.7;}

  /* Setlists */
  .setlist-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
  .setlist-card .card-top{display:flex;align-items:flex-start;gap:10px;}
  .setlist-card .card-reorder{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .setlist-card .card-reorder .icon-btn{width:30px;height:30px;font-size:13px;}
  .tag-badge{display:inline-block;background:var(--bg-card-2);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-bottom:6px;margin-right:4px;}
  .edit-tags-label{font-size:13px;color:var(--fg-dim);margin:4px 0 8px;font-weight:600;}
  .edit-tags-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:30px;}
  .edit-tags-empty{color:var(--fg-dim);font-size:13px;font-style:italic;}
  .tag-chip-editable{display:inline-flex;align-items:center;gap:4px;background:var(--bg-card-2);color:var(--accent);border-radius:999px;padding:5px 4px 5px 12px;font-size:13px;font-weight:600;}
  .tag-chip-editable button{background:none;border:none;color:var(--fg-dim);font-size:14px;cursor:pointer;padding:4px 8px;}
  .edit-tags-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .edit-tags-add-row input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px;}
  .edit-tags-add-row .btn{flex-shrink:0;}
  #edit-setlist-name{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px 14px;font-size:16px;margin:10px 0 16px;}
  .tag-manager-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .tag-manager-row:last-child{border-bottom:none;}
  .tag-manager-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 10px;font-size:14px;}
  .tag-manager-count{color:var(--fg-dim);font-size:12px;white-space:nowrap;flex-shrink:0;}
  .setlist-card h3{margin:0 0 4px;font-size:17px;}
  .setlist-card .sub{color:var(--fg-dim);font-size:13px;margin-bottom:12px;}
  .setlist-card .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .empty-state{color:var(--fg-dim);text-align:center;padding:60px 20px;font-size:15px;line-height:1.6;}
  .setlists-toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .setlists-toolbar .btn{flex:1;text-align:center;}
  #setlist-tag-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .reminder-banner{background:#2a2210;border:1px solid var(--accent-dim);color:var(--fg);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.4;}
  .reminder-banner span{flex:1;}
  .reminder-banner .btn{flex-shrink:0;padding:9px 13px;font-size:13px;}
  .fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));background:var(--accent);color:#1a1400;border:none;border-radius:999px;padding:16px 22px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:20;}

  /* Setlist detail */
  #detail-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  #detail-header .btn{flex-shrink:0;}
  #detail-title{font-size:19px;font-weight:700;flex:1;}
  .detail-sub{color:var(--fg-dim);font-size:13px;margin-bottom:14px;}
  .setlist-item{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;}
  .setlist-item .num{color:var(--accent);font-weight:700;font-size:14px;width:22px;text-align:center;flex-shrink:0;}
  .setlist-item .info{flex:1;min-width:0;}
  .setlist-item .name{font-size:15.5px;font-weight:600;}
  .setlist-item .meta{font-size:12px;color:var(--fg-dim);}
  .setlist-item .btns{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn{background:var(--bg-card-2);border:1px solid var(--line);color:var(--fg);border-radius:8px;width:34px;height:34px;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .icon-btn:active{opacity:.6;}
  .icon-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1400;}
  .detail-actions{display:flex;gap:10px;margin:16px 0 6px;position:sticky;bottom:0;background:var(--bg);padding-top:6px;padding-bottom:6px;}
  .detail-actions .btn{flex:1;text-align:center;padding:13px;font-size:15px;}
  .setlist-item.selected{border-color:var(--accent);background:#241f10;}
  .selection-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px;position:sticky;bottom:0;background:var(--bg);padding-top:6px;padding-bottom:6px;align-items:center;}
  .selection-toolbar .btn{flex:1 1 auto;text-align:center;padding:12px;font-size:13.5px;min-width:100px;}
  #selection-count{width:100%;color:var(--fg-dim);font-size:13px;margin-bottom:2px;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--bg-card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;}
  .modal-title .btn{margin-left:auto;}
  .modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .pick-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .pick-row .song-name{font-size:15px;}
  .pick-row .song-meta{margin-top:1px;}
  .pick-row .btn{flex-shrink:0;padding:8px 12px;font-size:13px;}
  #new-setlist-name{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px 14px;font-size:16px;margin-bottom:10px;}
  #modal-search-wrap{margin-bottom:10px;}
  #modal-search-wrap input{background:var(--bg);}

  /* Live performance */
  #live-overlay{position:fixed;inset:0;background:#000;color:#f5f0dc;z-index:100;display:none;flex-direction:column;}
  #live-overlay.active{display:flex;}
  #live-top{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid #222;flex-shrink:0;}
  #live-progress{color:#8a8478;font-size:14px;flex:1;text-align:center;}
  .live-icon-btn{background:#1c1c1c;border:1px solid #333;color:#f5f0dc;border-radius:8px;width:38px;height:38px;font-size:16px;flex-shrink:0;}
  #live-scrollbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #222;flex-shrink:0;}
  #live-scroll-toggle{background:#1c1c1c;border:1px solid #333;color:#f5f0dc;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:700;flex-shrink:0;}
  #live-scroll-toggle.active{background:var(--accent);border-color:var(--accent);color:#1a1400;}
  .scroll-speed-controls{display:flex;align-items:center;gap:8px;margin-left:auto;color:#8a8478;font-size:13.5px;flex-shrink:0;}
  #live-scroll-speed-label{min-width:64px;text-align:center;}
  #live-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 22px 30px;position:relative;}
  #live-song-title{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:4px;}
  #live-song-sub{font-size:15px;color:#8a8478;margin-bottom:18px;}
  #live-lyrics{white-space:pre-wrap;font-size:var(--live-font);line-height:1.6;font-weight:500;}
  #live-empty{color:#8a8478;font-size:20px;line-height:1.6;font-style:italic;}
  #live-nav{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #222;flex-shrink:0;}
  #live-nav .btn{flex:1;text-align:center;padding:16px;font-size:17px;font-weight:700;background:#1c1c1c;border:1px solid #333;color:#f5f0dc;}
  #live-nav .btn:disabled{opacity:.3;}
  .live-tap-zone{position:absolute;top:0;bottom:0;width:30%;z-index:1;}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Setlists</h1>
    <div class="tabbar">
      <button class="tab-btn active" data-tab="library">Library</button>
      <button class="tab-btn" data-tab="setlists">Setlists</button>
    </div>
  </div>

  <main class="view active" id="view-library">
    <div class="search-row">
      <div class="search-input-wrap" id="search-input-wrap">
        <input id="search-input" type="text" placeholder="Search songs, artists…" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="search-clear-btn" id="search-clear-btn" aria-label="Clear search">✕</button>
      </div>
    </div>
    <div class="search-row" style="margin-top:-6px;">
      <button class="filter-chip" data-filter="all">All</button>
      <button class="filter-chip" data-filter="lyrics">Has lyrics</button>
      <button class="filter-chip" data-filter="nolyrics">No lyrics</button>
    </div>
    <div class="count-line" id="library-count"></div>
    <div id="library-list"></div>
  </main>

  <main class="view" id="view-setlists">
    <div class="reminder-banner hidden" id="export-reminder-banner">
      <span id="export-reminder-text">You have changes since your last export.</span>
      <button class="btn accent" id="export-reminder-btn">Export now</button>
    </div>
    <div class="setlists-toolbar">
      <button class="btn" id="manage-tags-btn">🏷 Manage Tags</button>
      <button class="btn" id="export-setlists-btn">⬇ Export backup</button>
      <button class="btn" id="import-setlists-btn">⬆ Import backup</button>
      <input type="file" id="import-file-input" accept="application/json,.json" class="hidden">
    </div>
    <div id="setlist-tag-filter-row" class="hidden"></div>
    <div id="setlists-list"></div>
    <button class="fab" id="new-setlist-fab">+ New Setlist</button>
  </main>

  <main class="view" id="view-detail">
    <div id="detail-header">
      <button class="icon-btn" id="detail-back">‹</button>
      <div id="detail-title">Setlist</div>
      <button class="icon-btn" id="detail-select-toggle">☑</button>
      <button class="icon-btn" id="detail-rename">✎</button>
      <button class="icon-btn" id="detail-delete">🗑</button>
    </div>
    <div class="detail-sub" id="detail-sub"></div>
    <div id="detail-list"></div>
    <div class="detail-actions" id="detail-actions-normal">
      <button class="btn" id="detail-add-songs">+ Add Songs</button>
      <button class="btn accent" id="detail-start">▶ Start Performance</button>
    </div>
    <div class="selection-toolbar hidden" id="selection-toolbar">
      <span id="selection-count">0 selected</span>
      <button class="btn" id="selection-select-all">Select all</button>
      <button class="btn" id="selection-move">Move to…</button>
      <button class="btn" id="selection-copy">Copy to…</button>
      <button class="btn danger" id="selection-remove">Remove</button>
    </div>
  </main>
</div>

<div id="live-overlay">
  <div id="live-top">
    <button class="live-icon-btn" id="live-exit">✕</button>
    <div id="live-progress"></div>
    <button class="live-icon-btn" id="live-font-minus">A-</button>
    <button class="live-icon-btn" id="live-font-plus">A+</button>
  </div>
  <div id="live-scrollbar">
    <button id="live-scroll-toggle">▶ Auto-scroll</button>
    <div class="scroll-speed-controls">
      <button class="live-icon-btn" id="live-scroll-minus">−</button>
      <span id="live-scroll-speed-label">Speed 3</span>
      <button class="live-icon-btn" id="live-scroll-plus">+</button>
    </div>
  </div>
  <div id="live-body">
    <div class="live-tap-zone" id="tap-prev" style="left:0;"></div>
    <div class="live-tap-zone" id="tap-next" style="right:0;"></div>
    <div id="live-song-title"></div>
    <div id="live-song-sub"></div>
    <div id="live-lyrics"></div>
  </div>
  <div id="live-nav">
    <button class="btn" id="live-prev">‹ Prev</button>
    <button class="btn" id="live-next">Next ›</button>
  </div>
</div>

<div id="modal-root"></div>

    "lyrics": "1.\nDen blomstertid nu kommer\nmed lust och fägring stor.\nNu nalkas ljuvlig sommar\ndå gräs och gröda gror.\nDen blida solen väcker\nallt det som varit dött.\nDen allt med grönska täcker,\noch allt blir återfött.\n2.\nDe fagra blomsterängar\noch åkerns ädla säd,\nde rika örtesängar\noch alla gröna träd\nskall oss var dag påminna\nGuds godhets rikedom.\nLåt oss den nåd besinna\nsom räcker året om.\n3.\nNu hör vi fåglar sjunga\nmed mångahanda ljud.\nSkall icke då vår tunga\nlovsäga Herren Gud?\nMin själ, till Herrens ära\nstäm upp din glädjesång.\nHan vill oss rikligt nära\noch fröjda på en gång.\n4.\nO Jesus, du som frälsar,\ndu är de svagas tröst.\nDig, glädjesol, vi hälsar.\nVärm upp vårt kalla bröst.\nGjut kärlekseld i hjärta,\nförnya själ och håg.\nVänd bort all sorg och smärta\nsom på vårt sinne låg.\n5.\nDu Sarons blomster sköna,\ndu lilja i grön dal,\nack, värdes själen kröna\nmed dygder utan tal.\nBefukta henne ofta\nmed dagg där ovanfrån,\natt hon så ljuvt må dofta\nsom ros på Libanon.\n6.\nVälsigna årets gröda\noch vattna du vårt land.\nGiv alla mänskor föda,\nvälsigna sjö och strand.\nGjut fruktbarhet av höjden\nned till den vida jord.\nUppfyll vår själ med fröjden\noch sötman av ditt ord."

    "lyrics": "Saloon A Mock Ballad\nWords by George Whiting, Music by Roland E. Llab (Ernest R. Ball)\n\nVerse 1:\nI've been looking through the dictionary\nFor a word that's always running through my mind.\nThough I love the name of brother, I was looking for another\nAnd I must confess that word I cannot find\nCan it be that all its glories are forgotten,\nAnd it's buried with the language of the Greek?\nIf it is 'twill ever linger in my memory\nAs the first word that I heard my daddy Speak...\n\nChorus 1:\nSaloon, Saloon, Saloon.\nIt runs through my brain like a tune.\nI don't like café, And I hate cabaret,\nBut just mention saloon and my cares fade away.\nFor it brings back a fond recollection\nof a little old low ceiling room.\nWith a bar, and a rail, and a dime, and a pail. Saloon, saloon, saloon.\n\nVerse 2:\nI can picture swinging doors wide open.\nI can almost see the sawdust on the floor.\nAnd I dream of pals and cronies drinking highballs, steins and ponies,\nI can see the name of \"Ehret\" on the door;\nBut the free lunch counter now is but a memory,\nIt has vanished with the joys we used to know,\nNever more we'll hear that old familiar parting -\nJust one drink, boys, just one more before we go.\n\nChorus 2:\nSaloon, Saloon, Saloon.\nHave you been forgotten so soon.\nYou nestled so sweet in that little side street,\nso respected, protected by cops on the beat.\nSince you've left us the world seems in darkness,\nlike a cloud passing over the moon.\nNo more joys in my life, no more lies to my wife.\nSaloon, saloon, saloon."

    "lyrics": "Give me a ticket for an aeroplane\nI ain't got time to take no fast train\nOh, the lonely days are gone\nI'm coming home\nMy baby, she wrote me a letter\n\nI don't care how much I've got to spend\nI'm gonna find my way back home again\nOh the lonely days are gone\nI'm coming home\nMy baby, she wrote me a letter\n\nShe wrote me a letter\nSaid she couldn't live without me no more\nListen to me, mister, can't you see I've gotta\nSee my baby once more?\nAnyway\n\nI don't care how much I've got to spend\nI'm gonna find my way back home again\nOh the lonely days are gone\nI'm coming home\nMy baby, she wrote me a letter\n\nShe wrote me a letter\nSaid she couldn't live without me no more\nListen to me, mister, can't you see I've gotta\nSee my baby once more?\nAnyway\n\nGive me a ticket for an aeroplane\nI ain't got time to take no fast train\nOh, the lonely days are gone\nI'm coming home\nMy baby she wrote me a letter\n\nMy baby wrote me a letter\nMy baby wrote me a letter\nMy baby wrote me a letter"
  }

<script>
(function(){
  "use strict";
  var SONGS = JSON.parse(document.getElementById('song-data').textContent);
  var SONGS_BY_ID = {};
  SONGS.forEach(function(s){ SONGS_BY_ID[s.id] = s; });

  var STORAGE_KEY = 'hm_setlists_v1';
  var FONT_KEY = 'hm_live_font_v1';
  var LAST_MODIFIED_KEY = 'hm_last_modified_v1';
  var LAST_EXPORT_KEY = 'hm_last_export_v1';
  var ORDER_MIGRATED_KEY = 'hm_order_migrated_v1';
  var CURRENT_VIEW_KEY = 'hm_current_view_v1';

  function loadSetlists(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      // One-time migration: earlier versions stored setlists oldest-first and reversed
      // them only for display. Now display order follows storage order directly (so
      // manual reordering works), so flip existing data once to avoid it silently
      // reordering itself the first time this loads.
      if(list.length && !localStorage.getItem(ORDER_MIGRATED_KEY)){
        list.reverse();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }
      localStorage.setItem(ORDER_MIGRATED_KEY, '1');
      // Migrate the old single-tag field (string) to a tags array, and make sure
      // every setlist has one even if it predates tags entirely.
      list.forEach(function(sl){
        if(typeof sl.tags === 'undefined'){
          sl.tags = sl.tag ? [sl.tag] : [];
        }
        delete sl.tag;
      });
      return list;
    }catch(e){ return []; }
  }
  function saveSetlists(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    localStorage.setItem(LAST_MODIFIED_KEY, String(Date.now()));
  }
  function makeSetlist(name, songIds){
    return { id: uid(), name: name.trim(), date: '', tags: [], songIds: songIds ? songIds.slice() : [] };
  }
  function markExported(){
    localStorage.setItem(LAST_EXPORT_KEY, String(Date.now()));
  }
  function hasUnexportedChanges(){
    if(!setlists.length) return false;
    var lastMod = parseInt(localStorage.getItem(LAST_MODIFIED_KEY), 10);
    if(!lastMod) return false;
    var lastExp = parseInt(localStorage.getItem(LAST_EXPORT_KEY), 10);
    if(!lastExp) return true;
    return lastMod > lastExp;
  }
  var setlists = loadSetlists();

  function uid(){ return 's' + Date.now() + Math.floor(Math.random()*10000); }

  // ---------- Tabs ----------
  var tabBtns = document.querySelectorAll('.tab-btn');
  var views = document.querySelectorAll('main.view');
  function showView(name){
    views.forEach(function(v){ v.classList.toggle('active', v.id === 'view-' + name); });
    tabBtns.forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
    persistCurrentView(name);
  }
  function persistCurrentView(name){
    // Remembers which tab (and, if inside a setlist, which one) so a page
    // reload / Cmd-R lands back where the user was instead of resetting to Library.
    try{
      if(name === 'detail'){
        localStorage.setItem(CURRENT_VIEW_KEY, JSON.stringify({ tab: 'detail', setlistId: currentSetlistId }));
      } else {
        localStorage.setItem(CURRENT_VIEW_KEY, JSON.stringify({ tab: name, setlistId: null }));
      }
    }catch(e){}
  }
  tabBtns.forEach(function(b){
    b.addEventListener('click', function(){ showView(b.dataset.tab); });
  });

  // ---------- Library ----------
  var searchInput = document.getElementById('search-input');
  var searchInputWrap = document.getElementById('search-input-wrap');
  var searchClearBtn = document.getElementById('search-clear-btn');
  var libraryList = document.getElementById('library-list');
  var libraryCount = document.getElementById('library-count');
  var filterChips = document.querySelectorAll('.filter-chip');
  var currentFilter = 'all';

  function metaLine(song){
    var parts = [];
    if(song.artist && song.artist.length) parts.push(song.artist.join(', '));
    if(song.key && song.key.length) parts.push('Key: ' + song.key.join('/'));
    if(song.tuning && song.tuning.length) parts.push(song.tuning.join('/'));
    return parts.join(' · ');
  }

  function renderLibrary(){
    var q = searchInput.value.trim().toLowerCase();
    var filtered = SONGS.filter(function(s){
      if(currentFilter === 'lyrics' && !s.lyrics) return false;
      if(currentFilter === 'nolyrics' && s.lyrics) return false;
      if(!q) return true;
      var hay = (s.name + ' ' + (s.artist||[]).join(' ')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    libraryCount.textContent = filtered.length + ' of ' + SONGS.length + ' songs';
    libraryList.innerHTML = '';
    var frag = document.createDocumentFragment();
    filtered.forEach(function(song){
      var row = document.createElement('div');
      row.className = 'song-row';
      row.dataset.id = song.id;
      var head = document.createElement('div');
      head.className = 'song-row-head';
      head.innerHTML =
        '<div class="dot ' + (song.lyrics ? 'has' : 'none') + '"></div>' +
        '<div class="song-info">' +
          '<div class="song-name">' + escapeHtml(song.name) + '</div>' +
          '<div class="song-meta">' +
            '<span class="badge">' + song.source + '</span>' +
            (metaLine(song) ? '<span>' + escapeHtml(metaLine(song)) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="chevron">▾</div>';
      head.addEventListener('click', function(){
        row.classList.toggle('open');
        if(row.classList.contains('open') && !row.dataset.built){
          buildRowBody(row, song);
          row.dataset.built = '1';
        }
      });
      row.appendChild(head);
      frag.appendChild(row);
    });
    libraryList.appendChild(frag);
  }

  function buildRowBody(row, song){
    var body = document.createElement('div');
    body.className = 'song-row-body';
    if(song.lyrics){
      var pre = document.createElement('div');
      pre.className = 'lyrics-preview';
      pre.textContent = song.lyrics;
      body.appendChild(pre);
    } else {
      var note = document.createElement('div');
      note.className = 'no-lyrics-note';
      note.textContent = 'No lyrics on file for this one — check Notion if you need the words.';
      body.appendChild(note);
    }
    var actions = document.createElement('div');
    actions.className = 'row-actions';
    var addBtn = document.createElement('button');
    addBtn.className = 'btn accent';
    addBtn.textContent = '+ Add to Setlist';
    addBtn.addEventListener('click', function(){ openAddToSetlistModal(song.id); });
    actions.appendChild(addBtn);
    body.appendChild(actions);
    row.appendChild(body);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function updateSearchClearVisibility(){
    searchInputWrap.classList.toggle('has-value', searchInput.value.length > 0);
  }
  searchInput.addEventListener('input', function(){
    updateSearchClearVisibility();
    renderLibrary();
  });
  searchClearBtn.addEventListener('click', function(){
    searchInput.value = '';
    updateSearchClearVisibility();
    renderLibrary();
    searchInput.focus();
  });
  filterChips.forEach(function(chip){
    chip.addEventListener('click', function(){
      currentFilter = chip.dataset.filter;
      filterChips.forEach(function(c){ c.classList.toggle('active', c === chip); });
      renderLibrary();
    });
  });
  filterChips[0].classList.add('active');

  // ---------- Setlists list ----------
  var setlistsList = document.getElementById('setlists-list');
  var exportReminderBanner = document.getElementById('export-reminder-banner');
  var setlistTagFilterRow = document.getElementById('setlist-tag-filter-row');
  var currentSetlistTagFilter = 'all';
  function updateExportReminder(){
    exportReminderBanner.classList.toggle('hidden', !hasUnexportedChanges());
  }
  function renderSetlistTagFilters(){
    var tags = [];
    setlists.forEach(function(sl){
      (sl.tags||[]).forEach(function(t){ if(tags.indexOf(t) === -1) tags.push(t); });
    });
    tags.sort(function(a,b){ return a.localeCompare(b); });
    if(currentSetlistTagFilter !== 'all' && tags.indexOf(currentSetlistTagFilter) === -1){
      currentSetlistTagFilter = 'all';
    }
    setlistTagFilterRow.innerHTML = '';
    if(!tags.length){
      setlistTagFilterRow.classList.add('hidden');
      return;
    }
    setlistTagFilterRow.classList.remove('hidden');
    var allChip = document.createElement('button');
    allChip.className = 'filter-chip' + (currentSetlistTagFilter === 'all' ? ' active' : '');
    allChip.textContent = 'All';
    allChip.addEventListener('click', function(){ currentSetlistTagFilter = 'all'; renderSetlists(); });
    setlistTagFilterRow.appendChild(allChip);
    tags.forEach(function(tag){
      var chip = document.createElement('button');
      chip.className = 'filter-chip' + (currentSetlistTagFilter === tag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', function(){ currentSetlistTagFilter = tag; renderSetlists(); });
      setlistTagFilterRow.appendChild(chip);
    });
  }
  function renderSetlists(){
    updateExportReminder();
    renderSetlistTagFilters();
    setlistsList.innerHTML = '';
    if(!setlists.length){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No setlists yet. Tap "+ New Setlist" to build one for your next gig.';
      setlistsList.appendChild(empty);
      return;
    }
    var visibleSetlists = setlists.filter(function(sl){
      return currentSetlistTagFilter === 'all' || (sl.tags||[]).indexOf(currentSetlistTagFilter) !== -1;
    });
    if(!visibleSetlists.length){
      var emptyFiltered = document.createElement('div');
      emptyFiltered.className = 'empty-state';
      emptyFiltered.textContent = 'No setlists with this tag.';
      setlistsList.appendChild(emptyFiltered);
      return;
    }
    var canReorder = currentSetlistTagFilter === 'all';
    visibleSetlists.forEach(function(sl){
      var realIdx = setlists.indexOf(sl);
      var card = document.createElement('div');
      card.className = 'setlist-card';
      var withLyrics = sl.songIds.filter(function(id){ var s = SONGS_BY_ID[id]; return s && s.lyrics; }).length;
      var reorderHtml = canReorder ?
        '<div class="card-reorder">' +
          '<button class="icon-btn" data-act="up">↑</button>' +
          '<button class="icon-btn" data-act="down">↓</button>' +
        '</div>' : '';
      card.innerHTML =
        '<div class="card-top">' +
          reorderHtml +
          '<div style="flex:1;min-width:0;">' +
            (sl.tags && sl.tags.length ? '<div>' + sl.tags.map(function(t){ return '<span class="tag-badge">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' : '') +
            '<h3>' + escapeHtml(sl.name) + '</h3>' +
            '<div class="sub">' + sl.songIds.length + ' songs · ' + withLyrics + ' with lyrics' + (sl.date ? ' · ' + escapeHtml(sl.date) : '') + '</div>' +
            '<div class="actions">' +
              '<button class="btn accent" data-act="open">Open</button>' +
              '<button class="btn" data-act="perform">▶ Perform</button>' +
              '<button class="btn" data-act="duplicate">⧉ Duplicate</button>' +
              '<button class="btn" data-act="tags">🏷 Tags</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      card.querySelector('[data-act="open"]').addEventListener('click', function(){ openDetail(sl.id); });
      card.querySelector('[data-act="perform"]').addEventListener('click', function(){ startPerformance(sl.id); });
      card.querySelector('[data-act="duplicate"]').addEventListener('click', function(){ duplicateSetlist(sl.id); });
      card.querySelector('[data-act="tags"]').addEventListener('click', function(){ openEditSetlistModal(sl.id); });
      if(canReorder){
        card.querySelector('[data-act="up"]').addEventListener('click', function(){ moveSetlist(realIdx, -1); });
        card.querySelector('[data-act="down"]').addEventListener('click', function(){ moveSetlist(realIdx, 1); });
      }
      setlistsList.appendChild(card);
    });
  }
  function moveSetlist(idx, dir){
    var newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= setlists.length) return;
    var tmp = setlists[idx];
    setlists[idx] = setlists[newIdx];
    setlists[newIdx] = tmp;
    saveSetlists(setlists);
    renderSetlists();
  }
  function duplicateSetlist(setlistId){
    var sl = getSetlist(setlistId);
    var name = prompt('Name for the duplicate:', sl.name + ' (copy)');
    if(!name) return;
    var newSl = makeSetlist(name, sl.songIds);
    newSl.tags = (sl.tags || []).slice();
    setlists.unshift(newSl);
    saveSetlists(setlists);
    renderSetlists();
    openDetail(newSl.id);
  }

  // ---------- Export / Import backup ----------
  function exportSetlists(){
    if(!setlists.length){ alert('No setlists to export yet.'); return; }
    var blob = new Blob([JSON.stringify(setlists, null, 1)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = 'homesick-mac-setlists-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    markExported();
    updateExportReminder();
  }
  document.getElementById('export-setlists-btn').addEventListener('click', exportSetlists);
  document.getElementById('export-reminder-btn').addEventListener('click', exportSetlists);

  var importFileInput = document.getElementById('import-file-input');
  document.getElementById('import-setlists-btn').addEventListener('click', function(){
    importFileInput.value = '';
    importFileInput.click();
  });
  importFileInput.addEventListener('change', function(){
    var file = importFileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed)) throw new Error('not an array');
      }catch(e){
        alert('That file doesn\'t look like a valid setlists backup.');
        return;
      }
      if(!confirm('Import ' + parsed.length + ' setlist(s)? This replaces what\'s currently saved in this browser.')) return;
      setlists = parsed;
      saveSetlists(setlists);
      markExported(); // freshly imported data matches the backup file, so nothing "unexported" yet
      renderSetlists();
      alert('Import complete.');
    };
    reader.readAsText(file);
  });

  document.getElementById('new-setlist-fab').addEventListener('click', function(){
    var name = prompt('Setlist name (e.g. gig or venue name):');
    if(!name) return;
    var sl = makeSetlist(name);
    setlists.unshift(sl);
    saveSetlists(setlists);
    renderSetlists();
    openDetail(sl.id);
  });

  // ---------- Setlist detail ----------
  var currentSetlistId = null;
  var detailTitle = document.getElementById('detail-title');
  var detailSub = document.getElementById('detail-sub');
  var detailList = document.getElementById('detail-list');
  var detailActionsNormal = document.getElementById('detail-actions-normal');
  var selectionToolbar = document.getElementById('selection-toolbar');
  var selectionCountEl = document.getElementById('selection-count');
  var selectToggleBtn = document.getElementById('detail-select-toggle');
  var selectionMode = false;
  var selectedIndices = {};

  function getSetlist(id){
    return setlists.filter(function(s){ return s.id === id; })[0];
  }

  function openDetail(id){
    currentSetlistId = id;
    selectionMode = false;
    selectedIndices = {};
    detailActionsNormal.classList.remove('hidden');
    selectionToolbar.classList.add('hidden');
    selectToggleBtn.classList.remove('active');
    renderDetail();
    showView('detail');
  }

  function setSelectionMode(on){
    selectionMode = on;
    selectedIndices = {};
    detailActionsNormal.classList.toggle('hidden', on);
    selectionToolbar.classList.toggle('hidden', !on);
    selectToggleBtn.classList.toggle('active', on);
    renderDetail();
  }
  selectToggleBtn.addEventListener('click', function(){ setSelectionMode(!selectionMode); });

  function renderDetail(){
    var sl = getSetlist(currentSetlistId);
    if(!sl) return;
    detailTitle.textContent = sl.name;
    var withLyrics = sl.songIds.filter(function(id){ var s = SONGS_BY_ID[id]; return s && s.lyrics; }).length;
    detailSub.textContent = sl.songIds.length + ' songs · ' + withLyrics + ' with lyrics on file';
    detailList.innerHTML = '';
    if(selectionMode){
      var selCount = Object.keys(selectedIndices).length;
      selectionCountEl.textContent = selCount + ' selected';
    }
    if(!sl.songIds.length){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No songs yet. Tap "+ Add Songs" below to pull from the library.';
      detailList.appendChild(empty);
      return;
    }
    sl.songIds.forEach(function(songId, idx){
      var song = SONGS_BY_ID[songId];
      if(!song) return;
      var item = document.createElement('div');
      item.className = 'setlist-item' + (selectionMode && selectedIndices[idx] ? ' selected' : '');
      var controlsHtml = selectionMode ?
        '<div class="btns"><button class="icon-btn" data-act="check">' + (selectedIndices[idx] ? '☑' : '☐') + '</button></div>' :
        '<div class="btns">' +
          '<button class="icon-btn" data-act="up">↑</button>' +
          '<button class="icon-btn" data-act="down">↓</button>' +
          '<button class="icon-btn" data-act="remove">✕</button>' +
        '</div>';
      item.innerHTML =
        '<div class="num">' + (idx+1) + '</div>' +
        '<div class="dot ' + (song.lyrics ? 'has' : 'none') + '"></div>' +
        '<div class="info"><div class="name">' + escapeHtml(song.name) + '</div>' +
        '<div class="meta">' + escapeHtml(metaLine(song) || song.source) + '</div></div>' +
        controlsHtml;
      if(selectionMode){
        item.addEventListener('click', function(){
          if(selectedIndices[idx]){ delete selectedIndices[idx]; } else { selectedIndices[idx] = true; }
          renderDetail();
        });
      } else {
        item.querySelector('[data-act="up"]').addEventListener('click', function(){ moveSong(idx, -1); });
        item.querySelector('[data-act="down"]').addEventListener('click', function(){ moveSong(idx, 1); });
        item.querySelector('[data-act="remove"]').addEventListener('click', function(){ removeSong(idx); });
      }
      detailList.appendChild(item);
    });
  }

  document.getElementById('selection-select-all').addEventListener('click', function(){
    var sl = getSetlist(currentSetlistId);
    var allSelected = Object.keys(selectedIndices).length === sl.songIds.length && sl.songIds.length > 0;
    selectedIndices = {};
    if(!allSelected){
      sl.songIds.forEach(function(_, idx){ selectedIndices[idx] = true; });
    }
    renderDetail();
  });

  document.getElementById('selection-remove').addEventListener('click', function(){
    var sl = getSetlist(currentSetlistId);
    var idxsDesc = Object.keys(selectedIndices).map(Number).sort(function(a,b){ return b-a; });
    if(!idxsDesc.length){ alert('Select at least one song first.'); return; }
    if(!confirm('Remove ' + idxsDesc.length + ' song(s) from this setlist?')) return;
    idxsDesc.forEach(function(idx){ sl.songIds.splice(idx, 1); });
    saveSetlists(setlists);
    setSelectionMode(false);
  });

  document.getElementById('selection-move').addEventListener('click', function(){ openDestinationPicker('move'); });
  document.getElementById('selection-copy').addEventListener('click', function(){ openDestinationPicker('copy'); });

  function openDestinationPicker(mode){
    var sl = getSetlist(currentSetlistId);
    var idxsAsc = Object.keys(selectedIndices).map(Number).sort(function(a,b){ return a-b; });
    if(!idxsAsc.length){ alert('Select at least one song first.'); return; }
    var songIdsToMove = idxsAsc.map(function(i){ return sl.songIds[i]; });

    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var sheet = document.createElement('div');
    sheet.className = 'modal-sheet';
    var title = (mode === 'move' ? 'Move ' : 'Copy ') + songIdsToMove.length + ' song(s) to…';
    sheet.innerHTML = '<div class="modal-title">' + escapeHtml(title) + '<button class="btn ghost" id="dest-close">Cancel</button></div><div class="modal-body" id="dest-list"></div>';
    backdrop.appendChild(sheet);
    modalRoot.appendChild(backdrop);
    var list = sheet.querySelector('#dest-list');

    function applyToDestination(destSl){
      var addedCount = 0;
      songIdsToMove.forEach(function(sid){
        if(destSl.songIds.indexOf(sid) === -1){ destSl.songIds.push(sid); addedCount++; }
      });
      if(mode === 'move'){
        var idxsDesc = idxsAsc.slice().sort(function(a,b){ return b-a; });
        idxsDesc.forEach(function(idx){ sl.songIds.splice(idx, 1); });
      }
      saveSetlists(setlists);
      modalRoot.removeChild(backdrop);
      setSelectionMode(false);
      var verb = mode === 'move' ? 'Moved' : 'Copied';
      alert(verb + ' ' + addedCount + ' song(s) to "' + destSl.name + '"' + (addedCount < songIdsToMove.length ? ' (some were already there).' : '.'));
    }

    var otherSetlists = setlists.filter(function(s){ return s.id !== currentSetlistId; });
    otherSetlists.forEach(function(destSl){
      var row = document.createElement('div');
      row.className = 'pick-row';
      row.innerHTML = '<div class="info" style="flex:1;"><div class="song-name">' + escapeHtml(destSl.name) + '</div><div class="song-meta">' + destSl.songIds.length + ' songs</div></div>' +
        '<button class="btn accent">Choose</button>';
      row.querySelector('button').addEventListener('click', function(){ applyToDestination(destSl); });
      list.appendChild(row);
    });
    var newRow = document.createElement('div');
    newRow.className = 'pick-row';
    newRow.innerHTML = '<div class="info" style="flex:1;"><div class="song-name">+ New setlist…</div></div><button class="btn accent">Create</button>';
    newRow.querySelector('button').addEventListener('click', function(){
      var name = prompt('New setlist name:');
      if(!name) return;
      var newSl = makeSetlist(name);
      setlists.unshift(newSl);
      applyToDestination(newSl);
    });
    list.appendChild(newRow);
    sheet.querySelector('#dest-close').addEventListener('click', function(){ modalRoot.removeChild(backdrop); });
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) modalRoot.removeChild(backdrop); });
  }

  function moveSong(idx, dir){
    var sl = getSetlist(currentSetlistId);
    var newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= sl.songIds.length) return;
    var tmp = sl.songIds[idx];
    sl.songIds[idx] = sl.songIds[newIdx];
    sl.songIds[newIdx] = tmp;
    saveSetlists(setlists);
    renderDetail();
  }
  function removeSong(idx){
    var sl = getSetlist(currentSetlistId);
    sl.songIds.splice(idx, 1);
    saveSetlists(setlists);
    renderDetail();
  }

  document.getElementById('detail-back').addEventListener('click', function(){
    renderSetlists();
    showView('setlists');
  });
  document.getElementById('detail-rename').addEventListener('click', function(){
    openEditSetlistModal(currentSetlistId);
  });

  function openEditSetlistModal(setlistId){
    var sl = getSetlist(setlistId);
    var workingTags = (sl.tags || []).slice();

    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var sheet = document.createElement('div');
    sheet.className = 'modal-sheet';
    sheet.innerHTML =
      '<div class="modal-title">Edit Setlist<button class="btn ghost" id="edit-setlist-close">Cancel</button></div>' +
      '<input id="edit-setlist-name" type="text" autocomplete="off" autocorrect="off">' +
      '<div class="edit-tags-label">Tags</div>' +
      '<div class="edit-tags-chips" id="edit-tags-chips"></div>' +
      '<div class="edit-tags-add-row">' +
        '<input id="edit-tags-input" type="text" placeholder="Add or pick a tag…" list="existing-tags-datalist" autocomplete="off" autocorrect="off" spellcheck="false">' +
        '<button class="btn" id="edit-tags-add-btn">+ Add</button>' +
      '</div>' +
      '<datalist id="existing-tags-datalist"></datalist>' +
      '<button class="btn accent" id="edit-setlist-save" style="width:100%;">Save</button>';
    backdrop.appendChild(sheet);
    modalRoot.appendChild(backdrop);

    var nameInput = sheet.querySelector('#edit-setlist-name');
    nameInput.value = sl.name;
    var chipsEl = sheet.querySelector('#edit-tags-chips');
    var tagInput = sheet.querySelector('#edit-tags-input');
    var datalist = sheet.querySelector('#existing-tags-datalist');

    var allTags = [];
    setlists.forEach(function(s){ (s.tags||[]).forEach(function(t){ if(allTags.indexOf(t) === -1) allTags.push(t); }); });
    allTags.sort(function(a,b){ return a.localeCompare(b); });
    datalist.innerHTML = allTags.map(function(t){ return '<option value="' + escapeHtml(t) + '">'; }).join('');

    function renderChips(){
      chipsEl.innerHTML = '';
      if(!workingTags.length){
        var none = document.createElement('span');
        none.className = 'edit-tags-empty';
        none.textContent = 'No tags yet — add one below.';
        chipsEl.appendChild(none);
        return;
      }
      workingTags.forEach(function(tag, i){
        var chip = document.createElement('span');
        chip.className = 'tag-chip-editable';
        chip.innerHTML = escapeHtml(tag) + ' <button type="button">✕</button>';
        chip.querySelector('button').addEventListener('click', function(){
          workingTags.splice(i, 1);
          renderChips();
        });
        chipsEl.appendChild(chip);
      });
    }
    renderChips();

    function addTagFromInput(){
      var val = tagInput.value.trim();
      if(!val) return;
      if(workingTags.indexOf(val) === -1) workingTags.push(val);
      tagInput.value = '';
      renderChips();
      tagInput.focus();
    }
    sheet.querySelector('#edit-tags-add-btn').addEventListener('click', addTagFromInput);
    tagInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); addTagFromInput(); }
    });

    function closeModal(){ modalRoot.removeChild(backdrop); }
    sheet.querySelector('#edit-setlist-save').addEventListener('click', function(){
      var name = nameInput.value.trim();
      if(!name){ alert('Setlist needs a name.'); return; }
      sl.name = name;
      sl.tags = workingTags.slice();
      saveSetlists(setlists);
      closeModal();
      renderDetail();
      renderSetlists();
    });
    sheet.querySelector('#edit-setlist-close').addEventListener('click', closeModal);
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) closeModal(); });
  }

  // ---------- Tag Manager: rename or delete a tag everywhere it's used ----------
  function renameTagEverywhere(oldTag, newTag){
    newTag = newTag.trim();
    if(!newTag || newTag === oldTag) return;
    setlists.forEach(function(sl){
      if(!sl.tags) return;
      var idx = sl.tags.indexOf(oldTag);
      if(idx === -1) return;
      sl.tags.splice(idx, 1);
      if(sl.tags.indexOf(newTag) === -1) sl.tags.push(newTag);
    });
    saveSetlists(setlists);
  }
  function deleteTagEverywhere(tag){
    setlists.forEach(function(sl){
      if(!sl.tags) return;
      var idx = sl.tags.indexOf(tag);
      if(idx !== -1) sl.tags.splice(idx, 1);
    });
    saveSetlists(setlists);
  }
  function openTagManagerModal(){
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var sheet = document.createElement('div');
    sheet.className = 'modal-sheet';
    sheet.innerHTML =
      '<div class="modal-title">Manage Tags<button class="btn ghost" id="tag-manager-close">Close</button></div>' +
      '<div id="tag-manager-list"></div>';
    backdrop.appendChild(sheet);
    modalRoot.appendChild(backdrop);
    var listEl = sheet.querySelector('#tag-manager-list');

    function collectTags(){
      var counts = {};
      setlists.forEach(function(sl){
        (sl.tags||[]).forEach(function(t){ counts[t] = (counts[t]||0) + 1; });
      });
      return Object.keys(counts).sort(function(a,b){ return a.localeCompare(b); }).map(function(t){ return { tag: t, count: counts[t] }; });
    }

    function renderRows(){
      var tags = collectTags();
      listEl.innerHTML = '';
      if(!tags.length){
        var empty = document.createElement('div');
        empty.className = 'edit-tags-empty';
        empty.textContent = 'No tags in use yet — add one from a setlist\'s Tags button first.';
        listEl.appendChild(empty);
        return;
      }
      tags.forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'tag-manager-row';
        row.innerHTML =
          '<input type="text" class="tag-manager-input" value="' + escapeHtml(entry.tag) + '">' +
          '<span class="tag-manager-count">' + entry.count + ' setlist' + (entry.count === 1 ? '' : 's') + '</span>' +
          '<button class="icon-btn" data-act="delete" title="Delete this tag everywhere">🗑</button>';
        var input = row.querySelector('.tag-manager-input');
        function commitRename(){
          var newVal = input.value.trim();
          if(!newVal){ input.value = entry.tag; return; }
          if(newVal === entry.tag) return;
          renameTagEverywhere(entry.tag, newVal);
          renderSetlists();
          renderRows();
        }
        input.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
        });
        input.addEventListener('blur', commitRename);
        row.querySelector('[data-act="delete"]').addEventListener('click', function(){
          if(!confirm('Delete the tag "' + entry.tag + '" from all ' + entry.count + ' setlist' + (entry.count === 1 ? '' : 's') + '? This cannot be undone.')) return;
          deleteTagEverywhere(entry.tag);
          renderSetlists();
          renderRows();
        });
        listEl.appendChild(row);
      });
    }
    renderRows();

    function closeModal(){
      modalRoot.removeChild(backdrop);
      renderDetail();
    }
    sheet.querySelector('#tag-manager-close').addEventListener('click', closeModal);
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) closeModal(); });
  }
  document.getElementById('manage-tags-btn').addEventListener('click', openTagManagerModal);

  document.getElementById('detail-delete').addEventListener('click', function(){
    var sl = getSetlist(currentSetlistId);
    if(!confirm('Delete "' + sl.name + '"? This cannot be undone.')) return;
    setlists = setlists.filter(function(s){ return s.id !== currentSetlistId; });
    saveSetlists(setlists);
    renderSetlists();
    showView('setlists');
  });
  document.getElementById('detail-start').addEventListener('click', function(){
    startPerformance(currentSetlistId);
  });
  document.getElementById('detail-add-songs').addEventListener('click', function(){
    openPickerModal(currentSetlistId);
  });

  // ---------- Add-song modal (from library row) ----------
  var modalRoot = document.getElementById('modal-root');

  function openAddToSetlistModal(songId){
    if(!setlists.length){
      var name = prompt('You don\'t have a setlist yet. Name one to create it:');
      if(!name) return;
      var sl = makeSetlist(name, [songId]);
      setlists.unshift(sl);
      saveSetlists(setlists);
      alert('Added to "' + sl.name + '".');
      return;
    }
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var sheet = document.createElement('div');
    sheet.className = 'modal-sheet';
    sheet.innerHTML = '<div class="modal-title">Add to setlist<button class="btn ghost" id="modal-close">Close</button></div><div class="modal-body" id="modal-list"></div>';
    backdrop.appendChild(sheet);
    modalRoot.appendChild(backdrop);
    var list = sheet.querySelector('#modal-list');
    setlists.forEach(function(sl){
      var row = document.createElement('div');
      row.className = 'pick-row';
      var already = sl.songIds.indexOf(songId) !== -1;
      row.innerHTML = '<div class="info" style="flex:1;"><div class="song-name">' + escapeHtml(sl.name) + '</div><div class="song-meta">' + sl.songIds.length + ' songs</div></div>' +
        '<button class="btn ' + (already ? '' : 'accent') + '">' + (already ? 'Added' : '+ Add') + '</button>';
      var btn = row.querySelector('button');
      if(!already){
        btn.addEventListener('click', function(){
          sl.songIds.push(songId);
          saveSetlists(setlists);
          btn.textContent = 'Added';
          btn.classList.remove('accent');
        });
      }
      list.appendChild(row);
    });
    var newRow = document.createElement('div');
    newRow.className = 'pick-row';
    newRow.innerHTML = '<div class="info" style="flex:1;"><div class="song-name">+ New setlist…</div></div><button class="btn accent">Create</button>';
    newRow.querySelector('button').addEventListener('click', function(){
      var name = prompt('New setlist name:');
      if(!name) return;
      var sl = makeSetlist(name, [songId]);
      setlists.unshift(sl);
      saveSetlists(setlists);
      document.body.removeChild(backdrop);
    });
    list.appendChild(newRow);
    sheet.querySelector('#modal-close').addEventListener('click', function(){ modalRoot.removeChild(backdrop); });
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) modalRoot.removeChild(backdrop); });
  }

  // ---------- Song picker modal (from setlist detail) ----------
  function openPickerModal(setlistId){
    var sl = getSetlist(setlistId);
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var sheet = document.createElement('div');
    sheet.className = 'modal-sheet';
    sheet.innerHTML =
      '<div class="modal-title">Add songs<button class="btn ghost" id="picker-close">Done</button></div>' +
      '<div class="search-input-wrap" id="modal-search-wrap">' +
        '<input id="modal-search" type="text" placeholder="Search…" autocomplete="off" autocorrect="off" spellcheck="false">' +
        '<button class="search-clear-btn" id="modal-search-clear" aria-label="Clear search">✕</button>' +
      '</div>' +
      '<div class="modal-body" id="picker-list"></div>';
    backdrop.appendChild(sheet);
    modalRoot.appendChild(backdrop);
    var searchBox = sheet.querySelector('#modal-search');
    var pickerSearchWrap = sheet.querySelector('#modal-search-wrap');
    var pickerSearchClearBtn = sheet.querySelector('#modal-search-clear');
    var listEl = sheet.querySelector('#picker-list');

    function renderPicker(){
      var q = searchBox.value.trim().toLowerCase();
      var filtered = SONGS.filter(function(s){
        if(!q) return true;
        var hay = (s.name + ' ' + (s.artist||[]).join(' ')).toLowerCase();
        return hay.indexOf(q) !== -1;
      }).slice(0, 200);
      listEl.innerHTML = '';
      filtered.forEach(function(song){
        var row = document.createElement('div');
        row.className = 'pick-row';
        var already = sl.songIds.indexOf(song.id) !== -1;
        row.innerHTML =
          '<div class="dot ' + (song.lyrics ? 'has' : 'none') + '"></div>' +
          '<div class="info" style="flex:1;min-width:0;"><div class="song-name">' + escapeHtml(song.name) + '</div>' +
          '<div class="song-meta">' + escapeHtml(song.source) + (metaLine(song) ? ' · ' + escapeHtml(metaLine(song)) : '') + '</div></div>' +
          '<button class="btn ' + (already ? '' : 'accent') + '">' + (already ? 'Added' : '+ Add') + '</button>';
        var btn = row.querySelector('button');
        if(!already){
          btn.addEventListener('click', function(){
            sl.songIds.push(song.id);
            saveSetlists(setlists);
            btn.textContent = 'Added';
            btn.classList.remove('accent');
          });
        }
        listEl.appendChild(row);
      });
    }
    function updatePickerClearVisibility(){
      pickerSearchWrap.classList.toggle('has-value', searchBox.value.length > 0);
    }
    searchBox.addEventListener('input', function(){
      updatePickerClearVisibility();
      renderPicker();
    });
    pickerSearchClearBtn.addEventListener('click', function(){
      searchBox.value = '';
      updatePickerClearVisibility();
      renderPicker();
      searchBox.focus();
    });
    renderPicker();
    sheet.querySelector('#picker-close').addEventListener('click', function(){
      modalRoot.removeChild(backdrop);
      renderDetail();
    });
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop){ modalRoot.removeChild(backdrop); renderDetail(); } });
  }

  // ---------- Live performance ----------
  var liveOverlay = document.getElementById('live-overlay');
  var liveTitle = document.getElementById('live-song-title');
  var liveSub = document.getElementById('live-song-sub');
  var liveLyrics = document.getElementById('live-lyrics');
  var liveProgress = document.getElementById('live-progress');
  var livePrevBtn = document.getElementById('live-prev');
  var liveNextBtn = document.getElementById('live-next');
  var liveBody = document.getElementById('live-body');
  var performSongIds = [];
  var performIdx = 0;

  function startPerformance(setlistId){
    var sl = getSetlist(setlistId);
    if(!sl || !sl.songIds.length){ alert('Add some songs to this setlist first.'); return; }
    performSongIds = sl.songIds.slice();
    performIdx = 0;
    renderLiveSong();
    liveOverlay.classList.add('active');
    if(typeof setAutoScroll === 'function') setAutoScroll(false);
  }

  function renderLiveSong(){
    var song = SONGS_BY_ID[performSongIds[performIdx]];
    if(!song) return;
    liveTitle.textContent = song.name;
    liveSub.textContent = metaLine(song) || song.source;
    liveBody.scrollTop = 0;
    scrollPos = 0;
    if(song.lyrics){
      liveLyrics.textContent = song.lyrics;
      liveLyrics.classList.remove('hidden');
    } else {
      liveLyrics.innerHTML = '<div id="live-empty">No lyrics on file for this one.<br>Check Notion if you need the words — you\'ve got this from memory, or wing it.</div>';
    }
    liveProgress.textContent = 'Song ' + (performIdx+1) + ' of ' + performSongIds.length;
    livePrevBtn.disabled = performIdx === 0;
    liveNextBtn.disabled = performIdx === performSongIds.length - 1;
  }

  function liveNext(){ if(performIdx < performSongIds.length - 1){ performIdx++; renderLiveSong(); } }
  function livePrev(){ if(performIdx > 0){ performIdx--; renderLiveSong(); } }

  liveNextBtn.addEventListener('click', liveNext);
  livePrevBtn.addEventListener('click', livePrev);
  document.getElementById('tap-next').addEventListener('click', liveNext);
  document.getElementById('tap-prev').addEventListener('click', livePrev);
  document.getElementById('live-exit').addEventListener('click', function(){
    liveOverlay.classList.remove('active');
    setAutoScroll(false);
  });

  // ---------- Auto-scroll ----------
  var SCROLL_KEY = 'hm_autoscroll_v1';
  var scrollSpeeds = [12, 22, 35, 55, 80]; // px per second, slow -> fast
  var scrollToggleBtn = document.getElementById('live-scroll-toggle');
  var scrollMinusBtn = document.getElementById('live-scroll-minus');
  var scrollPlusBtn = document.getElementById('live-scroll-plus');
  var scrollSpeedLabel = document.getElementById('live-scroll-speed-label');
  var autoScrollOn = false;
  var autoScrollRAF = null;
  var autoScrollLastTs = null;
  var scrollSpeedIdx = 2;
  var scrollPos = 0; // true fractional scroll position - scrollTop itself rounds to whole pixels, which loses slow sub-pixel increments if read back each frame

  (function loadScrollPrefs(){
    try{
      var raw = localStorage.getItem(SCROLL_KEY);
      if(raw){
        var prefs = JSON.parse(raw);
        if(typeof prefs.speedIdx === 'number') scrollSpeedIdx = Math.max(0, Math.min(scrollSpeeds.length - 1, prefs.speedIdx));
      }
    }catch(e){}
  })();

  function saveScrollPrefs(){
    localStorage.setItem(SCROLL_KEY, JSON.stringify({ speedIdx: scrollSpeedIdx }));
  }

  function updateScrollUI(){
    scrollSpeedLabel.textContent = 'Speed ' + (scrollSpeedIdx + 1);
    scrollToggleBtn.textContent = autoScrollOn ? '⏸ Auto-scroll' : '▶ Auto-scroll';
    scrollToggleBtn.classList.toggle('active', autoScrollOn);
  }

  function autoScrollStep(ts){
    if(!autoScrollOn) return;
    if(autoScrollLastTs !== null){
      var dt = (ts - autoScrollLastTs) / 1000;
      var pxPerSec = scrollSpeeds[scrollSpeedIdx];
      scrollPos += pxPerSec * dt;
      liveBody.scrollTop = scrollPos;
      if(liveBody.scrollTop + liveBody.clientHeight >= liveBody.scrollHeight - 2 && liveBody.scrollHeight > 0){
        setAutoScroll(false);
        return;
      }
    }
    autoScrollLastTs = ts;
    autoScrollRAF = window.requestAnimationFrame(autoScrollStep);
  }

  function setAutoScroll(on){
    autoScrollOn = on;
    if(on){
      autoScrollLastTs = null;
      scrollPos = liveBody.scrollTop; // pick up from wherever the view currently is
      if(autoScrollRAF) window.cancelAnimationFrame(autoScrollRAF);
      autoScrollRAF = window.requestAnimationFrame(autoScrollStep);
    } else if(autoScrollRAF){
      window.cancelAnimationFrame(autoScrollRAF);
      autoScrollRAF = null;
    }
    updateScrollUI();
  }

  scrollToggleBtn.addEventListener('click', function(){ setAutoScroll(!autoScrollOn); });
  scrollMinusBtn.addEventListener('click', function(){
    scrollSpeedIdx = Math.max(0, scrollSpeedIdx - 1);
    saveScrollPrefs();
    updateScrollUI();
  });
  scrollPlusBtn.addEventListener('click', function(){
    scrollSpeedIdx = Math.min(scrollSpeeds.length - 1, scrollSpeedIdx + 1);
    saveScrollPrefs();
    updateScrollUI();
  });
  updateScrollUI();

  var liveFontSize = parseInt(localStorage.getItem(FONT_KEY), 10) || 30;
  function applyFontSize(){
    document.documentElement.style.setProperty('--live-font', liveFontSize + 'px');
    localStorage.setItem(FONT_KEY, liveFontSize);
  }
  document.getElementById('live-font-plus').addEventListener('click', function(){
    liveFontSize = Math.min(liveFontSize + 2, 48);
    applyFontSize();
  });
  document.getElementById('live-font-minus').addEventListener('click', function(){
    liveFontSize = Math.max(liveFontSize - 2, 16);
    applyFontSize();
  });
  applyFontSize();

  // ---------- Keyboard navigation (BT keyboard / laptop) ----------
  document.addEventListener('keydown', function(e){
    if(!liveOverlay.classList.contains('active')) return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault();
      liveNext();
    } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      livePrev();
    } else if(e.key === 'Escape'){
      e.preventDefault();
      liveOverlay.classList.remove('active');
      setAutoScroll(false);
    } else if(e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      setAutoScroll(!autoScrollOn);
    }
  });

  // ---------- Init ----------
  renderLibrary();
  renderSetlists();

  // Restore whichever tab (or setlist detail) was open before the last reload,
  // so Cmd-R / the browser reload button doesn't dump the user back to Library.
  (function restoreView(){
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(CURRENT_VIEW_KEY) || 'null'); }catch(e){ saved = null; }
    if(saved && saved.tab === 'detail' && saved.setlistId && getSetlist(saved.setlistId)){
      openDetail(saved.setlistId);
    } else if(saved && saved.tab === 'setlists'){
      showView('setlists');
    } else {
      showView('library');
    }
  })();
})();
</script>
</body>
</html>
